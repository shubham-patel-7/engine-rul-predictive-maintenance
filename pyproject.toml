[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-rul"
version = "1.0.0"
description = "Remaining-useful-life prediction for turbofan engines (NASA C-MAPSS): tree baselines vs LSTM, with a Streamlit health dashboard"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "xgboost>=2.0",
  "torch>=2.2", "matplotlib>=3.8", "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
